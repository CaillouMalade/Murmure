name: Prepare release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to prepare (never replaces a release)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check immutable tag, version and main ancestry
        id: source
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release.py check --tag "$TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      source-ref: ${{ needs.source.outputs.sha }}
  draft:
    needs: [source, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Murmure-macOS-${{ needs.source.outputs.sha }}
          path: dist
      - name: Validate exact downloads and prepare metadata
        env:
          TAG: ${{ needs.source.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/release.py prepare --tag "$TAG" --run-url "$RUN_URL"
      - name: Create draft prerelease without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.source.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          gh release create "$TAG" --verify-tag --draft --prerelease \
            --title "Murmure $VERSION (experimental)" --notes-file dist/release-notes.md \
            "dist/Murmure-$VERSION-macOS.zip" "dist/Murmure-$VERSION-worker.zip" \
            dist/START_HERE.txt dist/SHA256SUMS dist/RELEASE.json
